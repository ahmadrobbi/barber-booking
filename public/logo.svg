<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional - remove if you only want the icon) -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" />
  
  <!-- Calendar/Date grid -->
  <rect x="50" y="45" width="60" height="60" rx="8" fill="white" opacity="0.95" />
  
  <!-- Calendar header -->
  <rect x="50" y="45" width="60" height="15" rx="8" fill="#3B82F6" />
  <text x="100" y="58" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">MAR</text>
  
  <!-- Calendar dots (representing dates) -->
  <circle cx="60" cy="70" r="3" fill="#3B82F6" />
  <circle cx="75" cy="70" r="3" fill="#3B82F6" />
  <circle cx="90" cy="70" r="3" fill="#3B82F6" />
  
  <circle cx="60" cy="85" r="3" fill="#3B82F6" />
  <circle cx="75" cy="85" r="3" fill="#4F46E5" opacity="0.5" />
  <circle cx="90" cy="85" r="3" fill="#3B82F6" />
  
  <circle cx="60" cy="100" r="3" fill="#3B82F6" />
  <circle cx="75" cy="100" r="3.5" fill="#3B82F6" />
  <circle cx="90" cy="100" r="3" fill="#3B82F6" />
  
  <!-- Chain/Link symbol overlaid -->
  <g transform="translate(115, 80)">
    <!-- First link -->
    <rect x="0" y="0" width="18" height="12" rx="6" fill="none" stroke="white" stroke-width="2.5" />
    <!-- Second link -->
    <rect x="12" y="12" width="18" height="12" rx="6" fill="none" stroke="white" stroke-width="2.5" />
    <!-- Connection point -->
    <circle cx="21" cy="18" r="1.5" fill="white" />
  </g>
  
  <!-- Bottom accent line -->
  <line x1="50" y1="110" x2="110" y2="110" stroke="white" stroke-width="1.5" opacity="0.6" />
</svg>